name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck wsl-slim.sh

  psscriptanalyzer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $findings = Invoke-ScriptAnalyzer -Path compact-wsl.ps1 -Settings PSScriptAnalyzerSettings.psd1 -Severity Error,Warning
          if ($findings) { $findings | Format-Table -AutoSize | Out-String | Write-Host; exit 1 }

  pester:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          Install-Module Pester -Force -Scope CurrentUser -SkipPublisherCheck
          $result = Invoke-Pester -Path tests -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) { exit 1 }
